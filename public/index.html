<!--
  public/index.html
  -----------------
  Simple, beginner-friendly frontend for the College Library Management System.

  Notes for beginners (short):
  - This file contains the HTML structure and IDs/classes used by public/script.js.
  - Keep element IDs (like add-student-form, students-list, issue-student, etc.) unchanged so the JavaScript can find them.
  - The frontend calls backend APIs under /api (see server.js).
  - To customize labels or layout, edit this file; to change behavior, edit public/script.js.
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>College Library Management</title>
  <!-- Link to the stylesheet. Edit styles in public/style.css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>College Library Management</h1>
    <p class="subtitle">Simple demo project: add students, add books, issue and return books</p>
  </header>

  <!-- Main content is split into three columns:
       1) Add Student + Students list
       2) Add Book + Search + Books list
       3) Issue a Book + Currently issued list
       The JS uses element IDs below to attach listeners and populate data. -->
  <main>
    <section class="col">
      <h2>Add Student</h2>
      <!-- Form to add a student. Fields: name (required), department (required), phone (optional).
           When submitted, script.js sends a POST /api/students request. -->
      <form id="add-student-form">
        <input name="name" placeholder="Name" required>
        <input name="department" placeholder="Department" required>
        <input name="phone" placeholder="Phone">
        <button type="submit">Add Student</button>
      </form>

      <h2>Students</h2>
      <!-- Container where students are listed by the script. -->
      <div id="students-list"></div>
    </section>

    <section class="col">
      <h2>Add Book</h2>
      <!-- Form to add a book. Fields: book_name, author, quantity -->
      <form id="add-book-form">
        <input name="book_name" placeholder="Book Name" required>
        <input name="author" placeholder="Author" required>
        <input name="quantity" placeholder="Quantity" type="number" min="0" value="1">
        <button type="submit">Add Book</button>
      </form>

      <h2>Search Books</h2>
      <!-- Simple search box. Pressing "Search" will call GET /api/books/search?q=... -->
      <div class="search-row">
        <input id="search-q" placeholder="Search by name or author">
        <button id="search-btn">Search</button>
      </div>

      <h2>Books</h2>
      <!-- Container where books are listed by the script. -->
      <div id="books-list"></div>
    </section>

    <section class="col wide">
      <h2>Issue a Book</h2>
      <!-- Two selects are populated by the script with students and available books.
           Submitting this form issues the selected book to the selected student. -->
      <form id="issue-form">
        <select id="issue-student"></select>
        <select id="issue-book"></select>
        <button type="submit">Issue Book</button>
      </form>

      <h2>Issued Books (currently issued)</h2>
      <!-- Container where currently issued records (return_date IS NULL) are shown. -->
      <div id="issued-list"></div>
    </section>
  </main>

  <footer>
    <small>Beginner-friendly project — built with HTML, CSS, JavaScript, Node.js and MySQL</small>
  </footer>

  <!-- Main JavaScript file. Contains all client-side functionality. -->
  <script src="script.js"></script>
</body>
</html>
